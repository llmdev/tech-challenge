<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tech Challenge — Shell</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f9fafb; }
      header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 32px; }
      header .brand { font-weight: 700; font-size: 16px; color: #111827; }
      header nav { display: flex; gap: 8px; }
      header nav a { padding: 6px 14px; border-radius: 6px; font-size: 14px; font-weight: 500; color: #374151; text-decoration: none; transition: background 0.15s; }
      header nav a:hover { background: #f3f4f6; color: #111827; }
      header nav a.active { background: #eff6ff; color: #2563eb; }
      #root { padding: 24px; }
    </style>
    <script src="https://unpkg.com/systemjs@6.12.1/dist/system.min.js"></script>
  </head>
  <body>
    <header>
      <span class="brand">Tech Challenge</span>
      <nav>
        <a href="/mfe-next" id="nav-home">Dashboard</a>
        <a href="/mfe-transacoes" id="nav-transactions">Transações</a>
      </nav>
    </header>
    <div id="root"></div>
    <script type="systemjs-importmap">
      {
        "imports": {
          "mfe-next": "/vendor/mfe-next.js",
          "mfe-transactions": "/vendor/mfe-transactions.js"
        }
      }
    </script>
    <script src="/vendor/single-spa-shim.js"></script>
    <script type="module" src="/root-config.js"></script>
    <script>
      // Highlight active nav link
      (function() {
        var path = location.pathname;
        if (path.startsWith('/mfe-next')) document.getElementById('nav-home').classList.add('active');
        if (path.startsWith('/mfe-transacoes')) document.getElementById('nav-transactions').classList.add('active');
      })();
    </script>
  </body>
</html>
